<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Gestion Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1b2420;
    --ink-soft: #5b6560;
    --line: #e4e1d8;
    --brand: #0e5f4e;
    --brand-dark: #0a4a3d;
    --brand-soft: #e4efe9;
    --amber: #b5792a;
    --amber-soft: #f7ecd9;
    --red: #a3372c;
    --red-soft: #f8e6e3;
    --radius: 10px;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- STYLES GLOBAUX (utilises partout : modales, toutes les pages) ---------- */
  .brand-mark{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin-bottom:4px;
  }
  .brand-mark .sq{
    width:10px;height:10px;background:var(--brand);border-radius:2px;display:inline-block;
    margin-right:6px;
  }
  .brand-mark span{font-weight:700;font-size:19px;letter-spacing:-0.01em;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  input, select, textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    font-family:inherit;
    font-size:14px;
    background:#fff;
    color:var(--ink);
    margin-bottom:16px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--brand);}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    background:var(--brand);
    color:#fff;
    border:none;
    padding:11px 16px;
    border-radius:7px;
    font-size:14px;
    font-weight:600;
    transition:background .15s;
  }
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-secondary{
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 14px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
  }
  .btn-secondary:hover{border-color:var(--brand);color:var(--brand);}
  .page-header .btn-secondary{
    background:linear-gradient(90deg, #4aa8e8, #1f5fc4);
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    box-shadow:0 8px 20px rgba(31,95,196,0.3);
  }
  .page-header .btn-secondary:hover{background:linear-gradient(90deg, #6fc0f5, #2e72d8);color:#fff;border-color:transparent;}

  /* ---------- LOGIN (design Claude Design : fond anime, carte glassmorphism) ---------- */
  #login-screen{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, #050b1a 0%, #0c2350 30%, #163a7a 50%, #0c2350 70%, #050b1a 100%);
    font-family:'Inter', Helvetica, Arial, sans-serif;
  }
  #login-particles{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .login-lang-picker{
    position:absolute;
    top:24px;left:24px;
    display:flex;align-items:center;gap:8px;
    color:#fff;font-size:13px;
    z-index:3;cursor:pointer;
    user-select:none;
  }
  .login-lang-picker:hover{opacity:0.8;}
  .login-wrap{
    position:relative;z-index:2;
    width:100%;max-width:520px;
    padding:60px 20px;
    animation:loginFadeIn .6s ease-out;
  }
  @keyframes loginFadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .login-logo-badge{
    position:relative;
    width:84px;height:84px;
    margin:0 auto -42px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
    z-index:4;
  }
  .login-card{
    position:relative;
    margin-top:42px;
    padding:64px 40px 40px;
    border-radius:20px;
    background:rgba(30,70,140,0.28);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .login-card h1{
    text-align:center;color:#fff;font-size:30px;font-weight:700;margin:0;
  }
  .login-card .subtitle{
    text-align:center;color:#cfe0f5;font-size:14px;margin-top:8px;
  }
  .login-card form{margin-top:32px;display:flex;flex-direction:column;gap:18px;}
  .login-field{display:flex;flex-direction:column;gap:8px;}
  .login-field label{
    color:#fff;font-size:13px;font-weight:500;
    text-transform:none;letter-spacing:normal;
    display:flex;justify-content:space-between;align-items:center;margin:0;
  }
  .login-field label a{color:#6fd3f0;font-size:13px;font-weight:400;text-decoration:none;}
  .login-field label a:hover{text-decoration:underline;}
  .login-card input[type="text"],
  .login-card input[type="email"],
  .login-card input[type="password"]{
    width:100%;box-sizing:border-box;
    padding:12px 14px;border-radius:10px;
    background:rgba(10,30,60,0.55);
    border:1px solid rgba(255,255,255,0.15);
    color:#fff;font-size:14px;font-family:inherit;
    outline:none;margin:0;
    transition:border-color .15s;
  }
  .login-card input::placeholder{color:#a9c6e8;opacity:1;}
  .login-card input:focus{border-color:#6fc0f5;}
  .login-password-wrap{position:relative;}
  .login-password-wrap input{padding-right:44px !important;}
  .login-eye-toggle{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    cursor:pointer;color:#a9c6e8;font-size:16px;user-select:none;
    background:none;border:none;padding:0;
  }
  .login-remember{display:flex;align-items:center;gap:10px;margin-top:2px;}
  .login-remember .checkbox{
    width:18px;height:18px;border-radius:4px;border:1.5px solid #fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;background:transparent;
    transition:background .15s;
  }
  .login-remember .checkbox.checked{background:#fff;}
  .login-remember .checkbox span{color:#0c2350;font-size:12px;font-weight:700;line-height:1;}
  .login-remember span.label{color:#fff;font-size:13px;cursor:pointer;}
  .login-submit{
    margin-top:10px;width:100%;padding:14px;border:none;border-radius:10px;
    background:linear-gradient(90deg, #4aa8e8, #1f5fc4);
    color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 20px rgba(31,95,196,0.4);
    font-family:inherit;transition:background .2s;
  }
  .login-submit:hover{background:linear-gradient(90deg, #6fc0f5, #2e72d8);}
  #login-error{
    color:#ffb3ab;font-size:13px;
    background:rgba(163,55,44,0.25);
    border:1px solid rgba(255,120,105,0.3);
    border-radius:8px;padding:9px 12px;
    display:none;
  }
  .login-advanced{margin-top:18px;}
  .login-advanced summary{color:#a9c6e8;font-size:12px;cursor:pointer;list-style:none;}
  .login-advanced summary::-webkit-details-marker{display:none;}
  .login-advanced summary:before{content:'⚙ ';}
  .login-advanced input{
    margin-top:8px;font-family:var(--mono);font-size:12px;
  }

  /* ---------- APP SHELL ---------- */
  #app-screen{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:264px;
    background:linear-gradient(180deg, #050b1a 0%, #0c2350 50%, #163a7a 100%);
    color:#cfe3da;
    padding:0;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  .sidebar .brand-mark{padding:24px 20px 0;margin-bottom:0;gap:10px;}
  .sidebar .brand-mark .sq{
    width:30px;height:30px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    margin-right:0;
  }
  .sidebar .brand-mark span{color:#fff;font-size:17px;}
  .sidebar .tag{color:#9fb6dd;font-size:12px;margin:2px 0 14px 40px;}
  .sidebar hr.side-sep{border:none;height:1px;background:rgba(255,255,255,0.08);margin:6px 20px 8px;}
  nav.side-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:4px 12px;overflow-y:auto;}
  nav.side-nav button{
    text-align:left;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:#c7d6ef;
    padding:10px 12px;
    border-radius:9px;
    font-size:14px;
    font-weight:400;
    display:flex;
    align-items:center;
    gap:12px;
  }
  nav.side-nav button svg{flex-shrink:0;stroke:#9fb6dd;transition:stroke .15s;}
  nav.side-nav button .dot{display:none;}
  nav.side-nav button:hover{background:rgba(255,255,255,0.06);color:#fff;}
  nav.side-nav button:hover svg{stroke:#fff;}
  nav.side-nav button.active{
    background:rgba(255,255,255,0.10);
    border-left-color:#6fe0c0;
    color:#fff;
    font-weight:700;
  }
  nav.side-nav button.active svg{stroke:#fff;}
  .sidebar-footer{
    display:flex;align-items:center;gap:10px;
    padding:16px 20px 20px;
    border-top:1px solid rgba(255,255,255,0.08);
    margin-top:8px;
  }
  .sidebar-footer .avatar{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:13px;font-weight:700;flex-shrink:0;
  }
  .sidebar-footer .who-block{flex:1;min-width:0;}
  .sidebar-footer .who{
    font-size:13px;font-weight:600;color:#fff;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    margin-bottom:0;
  }
  .sidebar-footer button{
    width:auto;background:none;color:#7fd3f0;border:none;padding:0;
    font-size:12px;font-weight:500;cursor:pointer;
  }
  .sidebar-footer button:hover{text-decoration:underline;}

  main.content{flex:1;padding:40px 48px 60px;max-width:1200px;}
  .page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;flex-wrap:wrap;gap:24px;margin-right:56px;}
  .page-header h1{font-size:26px;margin:0 0 6px;letter-spacing:-0.01em;color:#1a2338;}
  .page-header p{margin:0;color:#5a6478;font-size:14px;}

  .cards-row{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .stat-card{
    background:#fff;
    border:none;
    border-radius:14px;
    box-shadow:0 4px 20px rgba(20,40,80,0.08);
    padding:18px 20px;
    min-width:150px;
    flex:1;
  }
  .stat-card .num{font-family:var(--mono);font-size:26px;font-weight:700;color:#1f5fc4;}
  .stat-card .lbl{font-size:12px;color:#8892a6;margin-top:4px;}

  .dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .dash-card{border-radius:14px;padding:18px 20px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08);}
  .dash-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dash-card-title{font-size:13px;font-weight:600;opacity:.92;}
  .dash-card-icon{opacity:.9;}
  .dash-card-value{font-family:var(--mono);font-size:24px;font-weight:700;}
  .dash-card-sub{font-size:12px;opacity:.85;margin-top:6px;background:rgba(255,255,255,.18);display:inline-block;padding:2px 8px;border-radius:6px;}
  .dash-mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 20px 8px;}
  .dash-mini{background:var(--bg-soft,#f7f8fb);border-radius:10px;padding:14px;text-align:center;}
  .dash-mini-num{font-family:var(--mono);font-size:20px;font-weight:700;}
  .dash-mini-lbl{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  @media(max-width:900px){ .dash-grid{grid-template-columns:repeat(2,1fr);} .dash-mini-stats{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:560px){ .dash-grid{grid-template-columns:1fr;} }

  .panel{
    background:#fff;
    border:none;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(20,40,80,0.08);
    overflow:hidden;
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 24px;
    border-bottom:1px solid #edf0f5;
  }
  .panel-head h2{font-size:15px;margin:0;font-weight:700;color:#1a2338;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:#8892a6;
    font-weight:700;
    padding:12px 24px;
    background:#fafbfd;
    border-bottom:1px solid #edf0f5;
  }
  td{padding:13px 24px;border-bottom:1px solid #edf0f5;color:#2c3348;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{font-family:var(--mono);text-align:right;}
  .empty-row td{color:#8892a6;text-align:center;padding:40px;font-style:italic;}

  .badge{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
  }
  .badge.ok{background:var(--brand-soft);color:var(--brand-dark);}
  .badge.warn{background:var(--amber-soft);color:var(--amber);}
  .badge.bad{background:var(--red-soft);color:var(--red);}

  /* modal */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(15,20,18,0.45);
    align-items:center;justify-content:center;
    z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:var(--radius);
    padding:26px 28px;
    width:420px;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.3);
  }
  .modal-box h3{margin:0 0 18px;font-size:16px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions button{flex:1;}
  .line-item{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;}
  .line-item select{flex:2;margin-bottom:0;}
  .line-item input{flex:1;margin-bottom:0;}
  .line-item button{flex-shrink:0;background:var(--red-soft);color:var(--red);border:none;border-radius:6px;padding:9px 10px;font-size:12px;font-weight:700;}
  #toast{
    position:fixed;bottom:20px;right:20px;
    background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:8px;
    font-size:13px;font-weight:500;
    opacity:0;transform:translateY(8px);
    transition:all .25s;
    z-index:100;
    max-width:340px;
  }
  #toast.show{opacity:1;transform:translateY(0);}
  #toast.err{background:var(--red);}

/* ---------- CENTRE D'ALERTES ---------- */
.alerts-bell{
  position:fixed;
  top:18px;
  right:24px;
  width:42px;height:42px;
  border-radius:50%;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 6px 16px -6px rgba(20,30,25,0.2);
  font-size:18px;
  display:flex;align-items:center;justify-content:center;
  z-index:60;
}
.alerts-bell:hover{border-color:var(--brand);}
.alerts-badge{
  position:absolute;
  top:-4px;right:-4px;
  background:var(--red);
  color:#fff;
  font-size:10.5px;
  font-weight:700;
  border-radius:20px;
  min-width:18px;height:18px;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px;
  border:2px solid #fff;
}
.alerts-panel{
  display:none;
  position:fixed;
  top:66px;right:24px;
  width:360px;
  max-height:70vh;
  overflow-y:auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 24px 50px -20px rgba(0,0,0,0.25);
  z-index:60;
}
.alerts-panel.open{display:block;}
.alerts-panel-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;
}
.alerts-panel-head h3{margin:0;font-size:13.5px;}
.alerts-list{padding:6px;}
.alert-item{
  display:flex;gap:10px;
  padding:10px 12px;
  border-radius:8px;
  align-items:flex-start;
}
.alert-item:hover{background:#fafaf7;}
.alert-item .dot{
  width:8px;height:8px;border-radius:50%;
  margin-top:5px;flex-shrink:0;
  background:var(--brand);
}
.alert-item.cheque_echeance .dot{background:var(--red);}
.alert-item.stock_bas .dot{background:var(--amber);}
.alert-item .body{flex:1;}
.alert-item .body .t{font-size:13px;font-weight:600;margin-bottom:2px;}
.alert-item .body .m{font-size:12px;color:var(--ink-soft);line-height:1.4;}
.alert-item button{
  background:none;border:none;color:var(--brand);
  font-size:11px;font-weight:600;cursor:pointer;padding:2px;
  flex-shrink:0;
}
.alerts-empty{padding:24px;text-align:center;color:var(--ink-soft);font-size:13px;font-style:italic;}

  /* ---------- RESPONSIVE MOBILE ---------- */
  .mobile-menu-btn{
    display:none;
    position:fixed;top:16px;left:16px;z-index:70;
    width:42px;height:42px;border-radius:10px;
    background:#12201b;color:#fff;border:none;
    font-size:20px;align-items:center;justify-content:center;
    box-shadow:0 6px 16px -6px rgba(0,0,0,0.3);
  }
  .mobile-overlay{
    display:none;
    position:fixed;inset:0;background:rgba(0,0,0,0.45);
    z-index:55;
  }
  .mobile-overlay.open{display:block;}
  .sidebar-close-btn{
    display:none;
    position:absolute;top:14px;right:14px;z-index:65;
    width:34px;height:34px;border-radius:8px;border:none;
    background:rgba(255,255,255,0.1);color:#fff;font-size:16px;
    align-items:center;justify-content:center;cursor:pointer;
  }
  .sidebar-close-btn:hover{background:rgba(255,255,255,0.2);}

  @media (max-width: 1024px) {
    .mobile-menu-btn{display:flex;}
    .shell{flex-direction:column;}
    .sidebar-close-btn{display:flex;}
    .sidebar{
      position:fixed;top:0;left:-280px;height:100vh;
      width:260px;z-index:60;
      transition:left .25s ease;
      box-shadow:0 0 30px rgba(0,0,0,0.4);
    }
    .sidebar.open{left:0;}
    main.content{
      padding:76px 18px 50px;
      max-width:100%;
    }
    .page-header{margin-right:0;flex-direction:column;align-items:stretch;}
    .page-header > div:last-child, .page-header .btn-secondary{width:100%;}
    .cards-row{flex-direction:column;}
    .panel{overflow-x:auto;}
    table{min-width:600px;}
    .alerts-bell{top:16px;right:16px;}
    .alerts-panel{
      right:12px;left:12px;width:auto;top:64px;
    }
    .modal-box{width:92vw;max-width:420px;}
    .login-wrap{padding:24px 14px;}
    .login-card{padding:56px 24px 28px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <canvas id="login-particles"></canvas>

  <div class="login-lang-picker" title="Une seule langue disponible pour le moment">
    <span style="font-size:10px;">▶</span><span>French - Français</span>
  </div>

  <div class="login-wrap">
    <div class="login-logo-badge">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <ellipse cx="26" cy="26" rx="20" ry="8" fill="none" stroke="#f5820c" stroke-width="2.5" transform="rotate(0 26 26)"></ellipse>
        <ellipse cx="26" cy="26" rx="20" ry="8" fill="none" stroke="#1e9e6b" stroke-width="2.5" transform="rotate(60 26 26)"></ellipse>
        <ellipse cx="26" cy="26" rx="20" ry="8" fill="none" stroke="#2f7de1" stroke-width="2.5" transform="rotate(120 26 26)"></ellipse>
        <circle cx="26" cy="26" r="4.5" fill="#1a3a6b"></circle>
      </svg>
    </div>

    <div class="login-card">
      <h1>Bienvenue</h1>
      <p class="subtitle">Chez Smart Gestion Pro Enterprise</p>

      <form id="login-form">
        <div class="login-field">
          <label>Nom d'utilisateur (email)</label>
          <input type="email" id="login-email" placeholder="Nom d'utilisateur" required>
        </div>

        <div class="login-field">
          <label>Mot de passe <a href="#" onclick="return false;">Mot de passe oublié ?</a></label>
          <div class="login-password-wrap">

// ---------------------------------------------------------------------
// API helper
// ---------------------------------------------------------------------
async function api(path, options = {}) {
  const res = await fetch(state.apiUrl + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      ...(options.headers || {}),
    },
  });
  let body = null;
  try { body = await res.json(); } catch (e) { /* reponse vide */ }
  if (!res.ok) {
    const message = (body && body.message) ? body.message : `Erreur HTTP ${res.status}`;
    throw new Error(Array.isArray(message) ? message.join(', ') : message);
  }
  return body;
}

// Upload de fichier (FormData) — pas de Content-Type manuel : le navigateur
// genere automatiquement le bon "multipart/form-data; boundary=..."
async function apiUpload(path, file, champ = 'fichier') {
  const formData = new FormData();
  formData.append(champ, file);
  const res = await fetch(state.apiUrl + path, {
    method: 'POST',
    headers: state.token ? { Authorization: 'Bearer ' + state.token } : {},
    body: formData,
  });
  let body = null;
  try { body = await res.json(); } catch (e) { /* reponse vide */ }
  if (!res.ok) {
    const message = (body && body.message) ? body.message : `Erreur HTTP ${res.status}`;
    throw new Error(Array.isArray(message) ? message.join(', ') : message);
  }
  return body;
}

// ---------------------------------------------------------------------
// ANIMATION DU FOND (reseau de particules) — canvas 2D, ~65 particules
// reliees par des lignes quand elles sont proches, effet "reseau de donnees"
// ---------------------------------------------------------------------
function initLoginParticles() {
  const canvas = document.getElementById('login-particles');
  if (!canvas || canvas.dataset.started) return;
  canvas.dataset.started = 'true';

  const ctx = canvas.getContext('2d');
  let particles = [];
  let width, height, raf;
  const colors = ['#f5820c', '#d96a05', '#7fe8d0', '#2f9e6b', '#6fc0f5', '#2f7de1'];
  const COUNT = 65;
  const LINK_DIST = 140;

  const resize = () => {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;
  };

  const init = () => {
    resize();
    particles = Array.from({ length: COUNT }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      r: Math.random() * 1.8 + 1.2,
      color: colors[Math.floor(Math.random() * colors.length)],
    }));
  };

  const step = () => {
    ctx.clearRect(0, 0, width, height);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;
    }
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          ctx.strokeStyle = `rgba(190, 220, 255, ${0.18 * (1 - dist / LINK_DIST)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    raf = requestAnimationFrame(step);
  };

  init();
  step();
  window.addEventListener('resize', init);
}

function startOfPeriod(period) {
  const now = new Date();
  if (period === 'semaine') { const d = new Date(now); d.setDate(d.getDate() - 7); return d; }
  if (period === 'annee') { return new Date(now.getFullYear(), 0, 1); }
  if (period === 'tout') { return new Date(2000, 0, 1); }
  return new Date(now.getFullYear(), now.getMonth(), 1); // mois (defaut)
}

async function loadCompareChart() {
  const chartEl = document.getElementById('dash-compare-chart');
  try {
    const [ventes, achats] = await Promise.all([api('/ventes'), api('/achats')]);

    const now = new Date();
    const mois = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      mois.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, label: d.toLocaleDateString('fr-FR', { month: 'short' }) });
    }

    const parMoisCa = {};
    ventes.filter(v => v.statut !== 'annulee').forEach(v => {
      const k = (v.dateVente || v.createdAt || '').slice(0, 7);
      parMoisCa[k] = (parMoisCa[k] || 0) + Number(v.totalHt || 0);
    });
    const parMoisAchats = {};
    achats.filter(a => a.statut !== 'annulee').forEach(a => {
      const k = (a.createdAt || '').slice(0, 7);
      parMoisAchats[k] = (parMoisAchats[k] || 0) + Number(a.totalHt || 0);
    });

    const donnees = mois.map(m => {
      const ca = parMoisCa[m.key] || 0;
      const achat = parMoisAchats[m.key] || 0;
      return { ...m, ca, achat, benefice: ca - achat };
    });

    const maxVal = Math.max(...donnees.flatMap(d => [d.ca, d.achat, Math.abs(d.benefice)]), 1);

    chartEl.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px;height:180px;">
        ${donnees.map(d => `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;">
            <div style="display:flex;align-items:flex-end;gap:3px;height:150px;">
              <div title="CA: ${money(d.ca)} DH" style="width:14px;background:#2563eb;border-radius:3px 3px 0 0;height:${Math.max(2, Math.round((d.ca / maxVal) * 150))}px;"></div>
              <div title="Achats: ${money(d.achat)} DH" style="width:14px;background:#ea580c;border-radius:3px 3px 0 0;height:${Math.max(2, Math.round((d.achat / maxVal) * 150))}px;"></div>
              <div title="Benefice: ${money(d.benefice)} DH" style="width:14px;background:#16a34a;border-radius:3px 3px 0 0;height:${Math.max(2, Math.round((Math.abs(d.benefice) / maxVal) * 150))}px;"></div>
            </div>
            <div style="font-size:11px;color:var(--ink-soft);text-transform:capitalize;">${d.label}</div>
          </div>`).join('')}
      </div>`;
  } catch (err) {
    chartEl.innerHTML = '<p style="text-align:center;color:var(--ink-soft);padding:20px 0;">Impossible de charger la comparaison.</p>';
  }
}

async function loadDashboardData() {
  const periode = document.getElementById('dash-periode').value;
  const statutFiltre = document.getElementById('dash-statut').value;
  const depuis = startOfPeriod(periode);

  try {
    const [ventesAll, produits, clients, depenses] = await Promise.all([
      api('/ventes'), api('/produits'), api('/clients'), api('/depenses'),
    ]);
    state.cache.produits = produits; state.cache.clients = clients;

    const ventesPeriode = ventesAll.filter(v => new Date(v.dateVente || v.createdAt) >= depuis && (!statutFiltre || v.statut === statutFiltre));
    const ventesValables = ventesPeriode.filter(v => v.statut !== 'annulee');
    const ventesAnnulees = ventesPeriode.filter(v => v.statut === 'annulee');
    const depensesPeriode = depenses.filter(d => new Date(d.dateDepense) >= depuis);

    const totalVentesTtc = ventesValables.reduce((s, v) => s + Number(v.totalTtc || 0), 0);
    const totalVentesHt = ventesValables.reduce((s, v) => s + Number(v.totalHt || 0), 0);
    const totalDepenses = depensesPeriode.reduce((s, d) => s + Number(d.montant || 0), 0);
    const depensesPro = depensesPeriode.filter(d => d.categorie === 'Professionnelle').length;
    const depensesPerso = depensesPeriode.filter(d => d.categorie === 'Personnelle').length;
    const beneficeNet = totalVentesHt - totalDepenses;
    const capitalInvesti = produits.filter(p => p.actif).reduce((s, p) => s + Number(p.prixAchatHt || 0), 0);
    const clientsDebiteurs = clients.filter(c => Number(c.solde) > 0);
    const dettesClients = clientsDebiteurs.reduce((s, c) => s + Number(c.solde), 0);

    document.getElementById('dash-cards').innerHTML = [
      dashboardCard('ventes', 'linear-gradient(135deg,#2563eb,#1d4ed8)', 'Ventes', money(totalVentesTtc) + ' DH', `${ventesValables.length} ventes`),
      dashboardCard('benefice', 'linear-gradient(135deg,#9333ea,#7e22ce)', 'Benefice Net', money(beneficeNet) + ' DH', 'Marge calculee'),
      dashboardCard('capital', 'linear-gradient(135deg,#16a34a,#15803d)', 'Capital Investi', money(capitalInvesti) + ' DH', `${produits.length} produits`),
      dashboardCard('retours', 'linear-gradient(135deg,#dc2626,#b91c1c)', 'Retours', String(ventesAnnulees.length), `${ventesAnnulees.length} commandes`),
      dashboardCard('depenses', 'linear-gradient(135deg,#ea580c,#c2410c)', 'Depenses', money(totalDepenses) + ' DH', `${depensesPro} pro + ${depensesPerso} perso`),
      dashboardCard('dettes', 'linear-gradient(135deg,#d97706,#b45309)', 'Dettes Clients', money(dettesClients) + ' DH', `${clientsDebiteurs.length} clients`),
    ].join('');

    // --- Activite journaliere : regroupement par jour ---
    const parJour = {};
    ventesPeriode.forEach(v => {
      const jour = (v.dateVente || v.createdAt || '').slice(0, 10);
      if (!jour) return;
      if (!parJour[jour]) parJour[jour] = { ventes: 0, retours: 0, revenu: 0 };
      if (v.statut === 'annulee') parJour[jour].retours += 1;
      else { parJour[jour].ventes += 1; parJour[jour].revenu += Number(v.totalTtc || 0); }
    });
    const jours = Object.keys(parJour).sort();
    const totalRevenuJournalier = jours.reduce((s, j) => s + parJour[j].revenu, 0);

    document.getElementById('dash-mini-stats').innerHTML = `
      <div class="dash-mini"><div class="dash-mini-num" style="color:#2563eb;">${ventesValables.length}</div><div class="dash-mini-lbl">Total Ventes</div></div>
      <div class="dash-mini"><div class="dash-mini-num" style="color:#dc2626;">${ventesAnnulees.length}</div><div class="dash-mini-lbl">Total Retours</div></div>
      <div class="dash-mini"><div class="dash-mini-num" style="color:#16a34a;">${money(totalRevenuJournalier)} DH</div><div class="dash-mini-lbl">Total Revenus</div></div>
      <div class="dash-mini"><div class="dash-mini-num" style="color:#7c3aed;">${jours.length}</div><div class="dash-mini-lbl">Jours Actifs</div></div>
    `;

    const chartEl = document.getElementById('dash-chart');
    if (!jours.length) {
      chartEl.innerHTML = '<p style="text-align:center;color:var(--ink-soft);padding:30px 0;">Pas assez de donnees pour afficher le graphique.<br>Effectuez quelques ventes pour voir l&#39;evolution.</p>';
    } else {
      const maxRevenu = Math.max(...jours.map(j => parJour[j].revenu), 1);
      const barW = Math.max(24, Math.min(48, Math.floor(680 / jours.length)));
      const bars = jours.map(j => {
        const h = Math.round((parJour[j].revenu / maxRevenu) * 120) || 2;
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div title="${j} : ${money(parJour[j].revenu)} DH" style="width:${barW - 8}px;height:${h}px;background:linear-gradient(180deg,#3b82f6,#1d4ed8);border-radius:4px 4px 0 0;"></div>
          <div style="font-size:10px;color:var(--ink-soft);writing-mode:vertical-rl;transform:rotate(180deg);height:40px;">${j.slice(5)}</div>
        </div>`;
      }).join('');
      chartEl.innerHTML = `<div style="display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding-bottom:8px;">${bars}</div>`;
    }
  } catch (err) {
    toast(err.message, true);
  }
}

async function renderProduits() {
  const content = document.getElementById('content');
  content.innerHTML = `

      <div class="panel-head"><h2>Tous les produits</h2></div>
      <table>
        <thead><tr><th>Nom</th><th>Reference</th><th class="num">Prix vente HT</th><th class="num">TVA</th><th>Statut</th><th></th></tr></thead>
        <tbody id="produits-body"><tr class="empty-row"><td colspan="6">Chargement…</td></tr></tbody>
      </table>
    </div>
  `;
  document.getElementById('new-produit-btn').addEventListener('click', () => openProduitModal());

  async function load() {
    try {
      const produits = await api('/produits');
      state.cache.produits = produits;
      const tbody = document.getElementById('produits-body');
      tbody.innerHTML = produits.length
        ? produits.map(p => `
            <tr>
              <td>${escapeHtml(p.nom)}</td>
              <td>${escapeHtml(p.reference || '—')}</td>
              <td class="num">${money(p.prixVenteHt)} MAD</td>
              <td class="num">${p.tauxTva}%</td>
              <td>${p.actif ? '<span class="badge ok">Actif</span>' : '<span class="badge bad">Inactif</span>'}</td>
              <td style="white-space:nowrap;">
                ${p.gereStock ? `<button class="btn-secondary" data-adjust-stock="${p.id}" data-nom="${escapeHtml(p.nom)}">Stock</button>` : ''}
                <button class="btn-secondary" data-edit="${p.id}">Modifier</button>
                ${p.actif ? `<button class="btn-secondary" data-delete="${p.id}" data-nom="${escapeHtml(p.nom)}">Supprimer</button>` : ''}
              </td>
            </tr>`).join('')
        : '<tr class="empty-row"><td colspan="6">Aucun produit. Cliquez sur "Nouveau produit" pour commencer.</td></tr>';

      tbody.querySelectorAll('button[data-adjust-stock]').forEach(btn => {
        btn.addEventListener('click', () => openStockModal(btn.dataset.adjustStock, btn.dataset.nom));
      });
      tbody.querySelectorAll('button[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const produit = produits.find(p => p.id === btn.dataset.edit);
          openProduitModal(produit);
        });
      });
      tbody.querySelectorAll('button[data-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm(`Desactiver le produit "${btn.dataset.nom}" ? Il n'apparaitra plus dans les listes, mais son historique est conserve.`)) return;
          try {
            await api(`/produits/${btn.dataset.delete}`, { method: 'DELETE' });
            toast('Produit desactive.');
            load();
          } catch (err) { toast(err.message, true); }
        });
      });
    } catch (err) {
      toast(err.message, true);
    }
  }
  load();
}

async function openStockModal(produitId, nomProduit) {
  const succursales = await api('/entreprises/succursales').catch(() => []);
  const succursaleOptions = succursales.map(s => `<option value="${s.id}">${escapeHtml(s.nom)}</option>`).join('');

  openModal(`
    <h3>Ajuster le stock — ${escapeHtml(nomProduit)}</h3>
    <form id="stock-form">
      <label>Succursale</label>
      <select id="sf-succursale">${succursaleOptions}</select>
      <label>Type de mouvement</label>
      <select id="sf-type">
        <option value="entree">Entree (reception, approvisionnement)</option>
        <option value="sortie">Sortie (perte, casse, retrait manuel)</option>
        <option value="inventaire">Inventaire (definir la quantite exacte)</option>
      </select>
      <label>Quantite</label>
      <input id="sf-quantite" type="number" step="0.001" min="0.001" required>
      <label>Motif (optionnel)</label>
      <input id="sf-motif" placeholder="ex: Inventaire annuel, casse...">
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn-primary">Valider</button>
      </div>
    </form>
  `);

  document.getElementById('stock-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api('/produits/stock/ajuster', {
        method: 'POST',
        body: JSON.stringify({
          produitId,
          succursaleId: document.getElementById('sf-succursale').value,
          type: document.getElementById('sf-type').value,
          quantite: parseFloat(document.getElementById('sf-quantite').value),
          motif: document.getElementById('sf-motif').value || undefined,
        }),
      });
      closeModal();
      toast('Stock ajuste.');
      renderProduits();
    } catch (err) { toast(err.message, true); }
  });
}

let ligneCount = 0;
function ligneRow(idx) {
  const options = state.cache.produits.map(p =>
    `<option value="${p.id}" data-prix="${p.prixVenteHt}" data-tva="${p.tauxTva}">${escapeHtml(p.nom)}</option>`).join('');
  return `
    <div class="line-item" data-idx="${idx}">
      <select class="vf-produit">${options}</select>
      <input class="vf-quantite" type="number" step="0.001" value="1" placeholder="Qte">
      <button type="button" onclick="this.closest('.line-item').remove()">✕</button>
    </div>`;
}

async function openVenteModal() {
  if (!state.cache.produits.length) {
    try { state.cache.produits = await api('/produits'); } catch (e) { toast(e.message, true); return; }
  }
  if (!state.cache.produits.length) {
    toast('Creez d\'abord au moins un produit.', true);
    return;
  }
  if (!state.cache.clients.length) {
    try { state.cache.clients = await api('/clients'); } catch (e) { /* optionnel */ }
  }

  const clientOptions = ['<option value="">Client de passage</option>']
    .concat(state.cache.clients.map(c => `<option value="${c.id}">${escapeHtml(c.nom)}</option>`)).join('');

  ligneCount = 0;
  openModal(`
    <h3>Nouvelle vente</h3>
    <form id="vente-form">
      <label>Client (optionnel)</label>
      <select id="vf-client">${clientOptions}</select>
      <label>Lignes</label>
      <div id="lignes-container">${ligneRow(ligneCount)}</div>
      <button type="button" class="btn-secondary" id="add-ligne-btn" style="margin-bottom:16px;">+ Ajouter une ligne</button>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn-primary">Valider la vente</button>
      </div>
    </form>
  `);

  document.getElementById('add-ligne-btn').addEventListener('click', () => {
    ligneCount++;
    document.getElementById('lignes-container').insertAdjacentHTML('beforeend', ligneRow(ligneCount));
  });

  document.getElementById('vente-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const lignes = Array.from(document.querySelectorAll('.line-item')).map(row => {
      const select = row.querySelector('.vf-produit');
      const opt = select.selectedOptions[0];
      return {
        produitId: select.value,
        quantite: parseFloat(row.querySelector('.vf-quantite').value),
        prixUnitaireHt: parseFloat(opt.dataset.prix),
        tauxTva: parseFloat(opt.dataset.tva),
      };
    });

    // Note : la succursale par defaut du seed est utilisee ici en dur pour la
    // demo. Dans une vraie interface, on la selectionnerait dynamiquement.
    let succursaleId = state.user?.succursaleId;
    if (!succursaleId) {
      try {
        const succursales = await api('/entreprises/succursales');
        succursaleId = succursales[0]?.id;
      } catch (e) { /* ignore */ }
    }

    try {
      await api('/ventes', {
        method: 'POST',
        body: JSON.stringify({
          succursaleId,
          clientId: document.getElementById('vf-client').value || undefined,
          lignes,
        }),
      });
      closeModal();
      toast('Vente enregistree.');
      renderVentes();
    } catch (err) { toast(err.message, true); }
  });
}

const LIBELLE_TYPE_DOC = {
  devis: 'DEVIS', proforma: 'FACTURE PROFORMA', bon_livraison: 'BON DE LIVRAISON',
  facture: 'FACTURE', avoir: 'AVOIR',

async function imprimerDocument(documentId) {
  try {
    const [doc, entreprise] = await Promise.all([
      api(`/facturation/documents/${documentId}`),
      api('/entreprises/moi'),
    ]);

    const lignesHtml = (doc.lignes || []).map(l => {
      const brut = l.quantite * l.prixUnitaireHt;
      const remise = brut * ((l.remisePct || 0) / 100);
      const totalLigneHt = brut - remise;
      return `
        <tr>
          <td>${escapeHtml(l.designation || l.produit?.nom || '—')}</td>
          <td style="text-align:right;">${money(l.quantite)}</td>

async function importerExcel(file, onSuccess) {

async function renderIa() {

  content.innerHTML = `

    </div>
    <div class="panel">
      <div class="panel-head"><h2>Lecture de document (OCR)</h2></div>
      <div style="padding:18px;">
        <label>Image du document (facture scannee, ticket...)</label>
        <input type="file" id="ocr-file" accept="image/*">
        <button class="btn-primary" id="ocr-submit-btn" style="width:auto;padding:9px 18px;margin-top:6px;">Analyser</button>
        <p id="ocr-status" style="color:var(--ink-soft);font-size:13px;margin-top:10px;"></p>
      </div>
      <table><thead><tr><th>Texte extrait</th><th class="num">Confiance</th></tr></thead>
        <tbody id="ocr-body"><tr class="empty-row"><td colspan="2">Aucune analyse.</td></tr></tbody></table>
    </div>
  `;

  document.getElementById('run-prevision-btn').addEventListener('click', async () => {
    try {
      await api('/ia/previsions/ventes', { method: 'POST', body: JSON.stringify({}) });
      toast('Prevision generee.');
      loadPrevisions();
    } catch (err) { toast(err.message, true); }
  });

  document.getElementById('ocr-submit-btn').addEventListener('click', async () => {
    const fileInput = document.getElementById('ocr-file');
    const statusEl = document.getElementById('ocr-status');
    if (!fileInput.files[0]) { toast('Choisissez une image d\'abord.', true); return; }
    statusEl.textContent = 'Analyse en cours (peut prendre quelques secondes)…';
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await api('/ia/ocr/lire-document', { method: 'POST', body: JSON.stringify({ imageBase64: reader.result }) });
        statusEl.textContent = '';
        toast('Document analyse.');
        loadOcr();
      } catch (err) { statusEl.textContent = ''; toast(err.message, true); }
    };
    reader.readAsDataURL(fileInput.files[0]);
  });

  async function loadPrevisions() {
    try {
      const previsions = await api('/ia/previsions');
      document.getElementById('previsions-body').innerHTML = previsions.length
        ? previsions.map(p => `<tr><td>${p.periode}</td><td class="num">${money(p.valeurPrevue)} MAD</td><td>${p.donneesJson?.methode || '—'}</td></tr>`).join('')
        : '<tr class="empty-row"><td colspan="3">Aucune prevision generee.</td></tr>';
    } catch (err) { toast(err.message, true); }
  }

  async function loadOcr() {
    try {

// ---------------------------------------------------------------------
// MENU MOBILE (tiroir de navigation)
// ---------------------------------------------------------------------
function initMobileMenu() {
  const btn = document.getElementById('mobile-menu-btn');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobile-overlay');
  const closeBtn = document.getElementById('sidebar-close-btn');

  const ouvrir = () => { sidebar.classList.add('open'); overlay.classList.add('open'); };
  const fermer = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); };

  btn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? fermer() : ouvrir();
  });
  closeBtn.addEventListener('click', fermer);
  overlay.addEventListener('click', fermer);
  // Ferme le tiroir automatiquement apres avoir choisi une page (mobile)
  document.getElementById('side-nav').addEventListener('click', (e) => {
    if (e.target.closest('button[data-page]')) fermer();
  });

  // Filet de securite : force l'affichage/masquage du bouton selon la
  // largeur reelle de la fenetre, independamment d'un eventuel probleme de
  // media query CSS (cache navigateur, etc.). Recalcule a chaque redimensionnement.
  const synchroniserAffichage = () => {
    const mobile = window.innerWidth <= 860;
    btn.style.display = mobile ? 'flex' : 'none';
    if (!mobile) fermer();
  };
  synchroniserAffichage();
  window.addEventListener('resize', synchroniserAffichage);
}

// ---------------------------------------------------------------------
// CENTRE D'ALERTES (notifications + cheques a echeance, visible partout)
// ---------------------------------------------------------------------
function initAlertsCenter() {
  const bell = document.getElementById('alerts-bell');
  const panel = document.getElementById('alerts-panel');

  bell.addEventListener('click', () => {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) refreshAlertsCenter();
  });
  document.addEventListener('click', (e) => {
    if (!panel.contains(e.target) && e.target !== bell && panel.classList.contains('open')) {
      panel.classList.remove('open');
    }
  });
  document.getElementById('alerts-refresh-btn').addEventListener('click', async () => {
    try {
      await api('/notifications/generer-toutes-les-alertes', { method: 'POST' });
    } catch (e) { /* silencieux : pas bloquant si l'utilisateur n'a pas la permission */ }
    refreshAlertsCenter();
  });

  // Regenere les alertes (stock bas + cheques a echeance) automatiquement
  // au demarrage, puis toutes les 60 secondes tant que la session est active.
  regenerateAndRefresh();
  setInterval(regenerateAndRefresh, 60000);
}

async function regenerateAndRefresh() {
  try { await api('/notifications/generer-toutes-les-alertes', { method: 'POST' }); }
  catch (e) { /* silencieux */ }
  refreshAlertsCenter();
}

async function refreshAlertsCenter() {
  try {
    const notifs = await api('/notifications');
    const nonLues = notifs.filter(n => !n.lue);
    const badge = document.getElementById('alerts-badge');
    if (nonLues.length > 0) {
      badge.style.display = 'flex';
      badge.textContent = nonLues.length > 9 ? '9+' : nonLues.length;
    } else {
      badge.style.display = 'none';
    }

    const list = document.getElementById('alerts-list');
    const aAfficher = notifs.slice(0, 30);
    list.innerHTML = aAfficher.length
      ? aAfficher.map(n => `
          <div class="alert-item ${n.type}" style="${n.lue ? 'opacity:.5' : ''}" data-id="${n.id}">
            <span class="dot"></span>
            <div class="body">
              <div class="t">${escapeHtml(n.titre)}</div>
              <div class="m">${escapeHtml(n.message || '')}</div>
            </div>
            ${n.lue ? '' : `<button data-mark="${n.id}">Lu</button>`}
          </div>`).join('')
      : '<p class="alerts-empty">Aucune alerte pour le moment.</p>';

    list.querySelectorAll('button[data-mark]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
          await api(`/notifications/${btn.dataset.mark}/lue`, { method: 'POST' });
          refreshAlertsCenter();
        } catch (err) { toast(err.message, true); }
      });
    });
  } catch (err) {
    // Silencieux : l'utilisateur peut ne pas avoir la permission notifications.lire
  }
}

// ---------------------------------------------------------------------
// UTIL
// ---------------------------------------------------------------------
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
document.getElementById('api-url').value = state.apiUrl;
initLoginParticles();
if (state.token && state.user) {
  enterApp();
}
</script>
